name: Frontend CI

# Runs the frontend test suite. Deployment is handled by Cloudflare Pages
# (root directory = frontend), not by GitHub Actions.

on:
  push:
    branches: ['main']
    paths: ['frontend/**', 'pipeline/**', 'scripts/dashboard_publish.py', 'scripts/dashboard_sync.py', 'scripts/verify_dashboard_deployment.py', 'scripts/tests/**', '.github/workflows/**']
  pull_request:
    paths: ['frontend/**', 'pipeline/**', 'scripts/dashboard_publish.py', 'scripts/dashboard_sync.py', 'scripts/verify_dashboard_deployment.py', 'scripts/tests/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run build
      - name: Exercise full nullable v2 frontend and built-output verification offline
        run: npm run test:v2
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements-dashboard.txt
      - run: python -m pip install -r requirements-dashboard.txt
        working-directory: pipeline
      - run: python -m unittest discover -s tests -p 'test_german_electricity*.py' -v
        working-directory: pipeline
        env:
          PYTHONPATH: .
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
