name: Electricity dashboard refresh

# The schedule lives on main; production runs only released code and data.
# Main synchronization is a separate job and cannot block production refreshes.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Refresh production using released code, then attempt validated sync to main
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: electricity-dashboard-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Refresh and verify production (or validate only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    outputs:
      release_sha: ${{ steps.verified.outputs.release_sha }}
    steps:
      - name: Authorize publishing trigger
        if: env.PUBLISH == 'true'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Publishing dispatch requires the main ref" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && 'releases/cloudflare' || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify publication starts from the current production commit
        if: env.PUBLISH == 'true'
        id: release
        run: |
          base=$(python3 scripts/dashboard_publish.py check)
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements-dashboard.txt
      - name: Install narrow pipeline runtime
        working-directory: pipeline
        run: python -m pip install -r requirements-dashboard.txt
      - name: Test recent pipeline and persistent history
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_german_electricity*.py' -v
      - name: Test publication and synchronization safeguards
        run: python -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Refresh isolated components and validate the complete bundle
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: python -m src.data_pipelines.dashboards.german_electricity.refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend and build snapshot
        working-directory: frontend
        run: |
          npm ci
          npm test -- --runInBand
          npm run lint
          npm run build
      - name: Retain validated export for review (not publication)
        uses: actions/upload-artifact@v4
        with:
          name: german-electricity-validated-snapshot
          path: |
            frontend/src/_data/germanElectricity.json
            frontend/src/_data/germanElectricityTrade.json
            frontend/src/_data/germanElectricityAnnual.json
            frontend/src/_data/germanElectricityProgress.json
            frontend/src/data-history/german-electricity/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish only allowed data changes to production
        if: env.PUBLISH == 'true'
        env:
          RELEASE_BASE: ${{ steps.release.outputs.base }}
        run: python3 scripts/dashboard_publish.py publish --base "$RELEASE_BASE"
      - name: Confirm the public deployment matches the validated snapshots
        id: verified
        if: env.PUBLISH == 'true'
        run: |
          python3 scripts/verify_dashboard_deployment.py --timeout 240 --interval 10
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Production verified at $(git rev-parse HEAD). Main synchronization is separate." >> "$GITHUB_STEP_SUMMARY"

  sync-main:
    name: Synchronize verified release into main
    needs: validate
    if: needs.validate.outputs.release_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: releases/cloudflare
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare merge of verified production into current main
        id: prepare
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo "Release moved after verification; production is unaffected" >&2; exit 1; }
          python3 scripts/dashboard_sync.py prepare --release "$RELEASE_SHA" \
            --worktree "$RUNNER_TEMP/dashboard-sync" \
            --state "$RUNNER_TEMP/dashboard-sync.json" >> "$GITHUB_OUTPUT"
      - name: Install candidate dashboard runtime
        if: steps.prepare.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/dashboard-sync/pipeline
        run: python -m pip install -r requirements-dashboard.txt
      - name: Validate merged pipeline and publication safeguards offline
        if: steps.prepare.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/dashboard-sync
        run: |
          (cd pipeline && PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_german_electricity*.py' -v)
          python -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          node-version: '20'
      - name: Validate merged frontend without fetching source data
        if: steps.prepare.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/dashboard-sync/frontend
        run: |
          npm ci
          npm test -- --runInBand
          npm run lint
          npm run build
      - name: Push validated merge to main only
        # Use the released script, never the candidate's publisher. This also
        # checks an already-integrated no-op without pushing anything.
        run: python3 scripts/dashboard_sync.py publish --state "$RUNNER_TEMP/dashboard-sync.json"
      - name: Report synchronization outcome
        if: always()
        env:
          SYNC_STATUS: ${{ job.status }}
        run: |
          echo "Main synchronization: $SYNC_STATUS. Verified production commit: $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
          if [ "$SYNC_STATUS" != "success" ]; then
            echo "::error::Main synchronization failed; production was already verified and is unaffected. Review conflicts, validation, or branch movement. The next publishing run retries sync, even with unchanged data."
          fi
